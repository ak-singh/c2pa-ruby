name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
        # Linux added in M5 when rake update_binaries downloads binaries at CI time.
        # Until then only the bundled aarch64-apple-darwin binary is present.
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run specs
        run: bundle exec rspec --format documentation

  # Ensure the gem builds and installs cleanly
  build:
    name: Gem build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build gem
        run: gem build c2pa.gemspec

      - name: Verify gem contents
        run: |
          gem_file=$(ls *.gem | head -1)
          echo "Built: $gem_file"
          gem contents "$gem_file"
