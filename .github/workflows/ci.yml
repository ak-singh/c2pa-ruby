name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Download native binaries
        run: bundle exec rake update_binaries

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run specs
        run: bundle exec rspec --format documentation

  # Ensure the gem builds and installs cleanly
  build:
    name: Gem build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build gem
        # `rake build` runs update_binaries first via the enhanced task,
        # so the packaged gem includes the native libraries.
        run: bundle exec rake build

      - name: Verify gem contents
        run: |
          gem_file=$(ls pkg/*.gem | head -1)
          echo "Built: $gem_file"
          gem unpack "$gem_file" --target /tmp/gem-inspect
          find /tmp/gem-inspect -type f | sort
          # Sanity-check that native libraries actually shipped
          test -f /tmp/gem-inspect/*/libs/aarch64-apple-darwin/libc2pa_c.dylib
          test -f /tmp/gem-inspect/*/libs/x86_64-unknown-linux-gnu/libc2pa_c.so
